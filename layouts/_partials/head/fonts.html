{{- /*
  Loads webfonts when site.Params.fontsHref is set.
  Sites that prefer the system stack should leave fontsHref empty and
  rely on the default values in their --font-sans / --font-mono tokens.
*/ -}}
{{- with site.Params.fontsHref -}}
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="{{ . }}" rel="stylesheet">
{{- end -}}
