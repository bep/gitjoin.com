{{- $name := site.Params.name | default "gitjoin" -}}
<footer class="site-footer">
	<span class="label">{{ $name }} {{ site.Params.version }} &middot; {{ site.Home.Params.licenseName }} &middot; {{ now.Year }}</span>
	<nav class="footer-links" aria-label="Footer">
		<a class="label" href="{{ site.Params.repoURL }}" rel="noopener">Source</a>
		<a class="label" href="{{ site.Params.repoURL }}/releases" rel="noopener">Releases</a>
		<a class="label" href="{{ site.Params.repoURL }}/issues" rel="noopener">Issues</a>
		<a class="label" href="https://gohugo.io/">Built with Hugo</a>
	</nav>
</footer>
