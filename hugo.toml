baseURL                = "https://gitjoin.com/"
title                  = "gitjoin: Virtual monorepo made simple."
locale                 = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT        = true

disableKinds = ["taxonomy", "term", "404", "page", "rss", "section"]

[params]
  name = "gitjoin"
  version = "v0.4.0"
  description = "gitjoin turns many Git repositories into one virtual monorepo. List repos in plain-text gitjoin.txt files and one command clones, pulls and prunes them. Open source, written in Go, no submodules."
  author = "Bjørn Erik Pedersen"
  authorURL = "https://github.com/bep"
  authorHandle = "bep"
  twitterHandle = "bepsays"
  repoURL = "https://github.com/bep/gitjoin"
  themeColor = "#0b0c0d"
  fontsHref = "https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fragment+Mono&display=swap"
  keywords = [
    "virtual monorepo",
    "git monorepo",
    "monorepo tool",
    "multi-repo",
    "polyrepo",
    "git submodules alternative",
    "manage multiple git repositories",
    "monorepo CLI",
    "gitjoin",
    "Go monorepo tool",
  ]

# Design tokens consumed via @import "hugo:vars" in main.css.
# gitjoin is dark only, strictly monochrome — no [params.vars.dark] override block needed.
[params.vars]
  bg        = "oklch(14.5% 0.002 250)"
  surface   = "oklch(17.5% 0.002 250)"
  surface-2 = "oklch(21% 0.003 250)"
  rule      = "oklch(29% 0.003 250)"
  rule-soft = "oklch(23% 0.003 250)"
  fg        = "oklch(96.5% 0.002 250)"
  fg-mute   = "oklch(76% 0.003 250)"
  fg-dim    = "oklch(58% 0.003 250)"
  fg-ghost  = "oklch(42% 0.003 250)"
  font-sans = '"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif'
  font-mono = '"Fragment Mono", ui-monospace, SFMono-Regular, Menlo, monospace'

[sitemap]
  changefreq = "weekly"
  priority   = 1.0
  filename   = "sitemap.xml"
